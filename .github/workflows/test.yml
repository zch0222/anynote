name: Unit Tests

# 目的：执行 CLAUDE.md「测试要求（强制）」约定的单元测试门禁。
#
# 只跑**纯单测**：Java 侧由 services/pom.xml 的 surefire `excludedGroups=integration`
# 自动排除需要 MySQL / Redis / Nacos / RocketMQ 的 @Tag("integration") 用例；
# 前端侧 vitest 跑在 jsdom 里，不依赖后端。因此本 workflow 不需要起 docker 全栈，
# 与重量级的 openapi-check.yml 分开，保证 PR 上能快速反馈。
#
# 集成测试需要中间件，暂不在 CI 跑，本地用：
#   mvn test -pl <module> -DexcludedGroups=

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  java:
    name: Java unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Run unit tests
        run: |
          cd services
          mvn -B clean test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/**/target/surefire-reports/**
          retention-days: 7

  web:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  cli:
    name: CLI manifest drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CLI 单测已经由上面的 web job（pnpm test 经 turbo 覆盖全 workspace）跑过，
    # 这里只做生成物漂移检查：manifest 只读命令注册表，不需要后端。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @anynote/cli build

      - name: Regenerate command reference
        run: pnpm --filter @anynote/cli manifest:write

      - name: Detect manifest drift
        run: |
          if ! git diff --exit-code docs/cli/COMMANDS.md .claude/skills/anynote-cli/reference/; then
            echo ""
            echo "::error::CLI 命令文档漂移。本地跑 pnpm --filter @anynote/cli build && pnpm --filter @anynote/cli manifest:write，并提交生成物。"
            exit 1
          fi
          echo "CLI command reference matches generated output."

  deployment:
    name: Deployment configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate container settings and Compose merges
        run: |
          node --test infra/web/config.test.mjs
          python3 -m unittest discover -s infra/tests -v
