[package]
name = "anynote-desktop"
version = "0.6.0"
description = "Anynote 桌面壳"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 的标准布局：二进制入口只调用 lib 的 run()，移动端复用同一份 lib
name = "anynote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
