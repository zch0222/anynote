name: ${COMPOSE_PROJECT_NAME:-anynote}

# 开发用 override：禁用应用容器自动重启（启动失败直接看日志排查，不重试）。
# 用法（务必加 --env-file infra/.env.dev.local，避免误加载本地 .env 中的宿主机配置，
# 里面的 127.0.0.1 类 host 覆盖会污染容器环境，例如 ROCKETMQ_BROKER_ADVERTISE_IP；
# 该文件从 infra/.env.dev.local.example 拷贝，只放开发用 AI 凭据主密钥）：
#   docker compose --env-file .env.dev.local -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build
# 覆盖 Next.js、协同服务与 9 个 Spring 应用；中间件保持原值。
# Web 构建/运行来源与协同握手来源固定为 localhost，避免 shell 覆盖造成 BFF Origin 校验不一致。

x-app-dev: &app-dev
  restart: "no"


services:
  anynote-web:
    <<: *app-dev
    build:
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234
    environment:
      DEPLOYMENT_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234
  anynote-manage-web:
    <<: *app-dev
    build:
      args:
        NUXT_PUBLIC_APP_URL: http://localhost:3080
    environment:
      DEPLOYMENT_ENV: development
      NUXT_PUBLIC_APP_URL: http://localhost:3080
  anynote-gateway:
    <<: *app-dev
  anynote-auth:
    <<: *app-dev
  anynote-modules-system:
    <<: *app-dev
  anynote-modules-note:
    <<: *app-dev
  anynote-modules-file:
    <<: *app-dev
  anynote-modules-ai:
    <<: *app-dev
  anynote-ai-harness:
    <<: *app-dev
  anynote-ai-indexer:
    <<: *app-dev
  anynote-ai-whisper:
    <<: *app-dev
  anynote-modules-manage:
    <<: *app-dev
  anynote-modules-notify:
    <<: *app-dev
  anynote-modules-job:
    <<: *app-dev
  anynote-collab:
    <<: *app-dev
    environment:
      COLLAB_ALLOWED_ORIGINS: http://localhost:3000
