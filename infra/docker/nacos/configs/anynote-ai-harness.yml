harness:
  model-turns: 8
  tool-calls: 16
  wall-clock-s: 90
  context-tokens: 24000
  tool-timeout-s: 30
  connect-timeout-s: 3
  first-output-timeout-s: 30
  stream-idle-timeout-s: 30
  total-timeout-s: 120
  heartbeat-interval-s: 5
  history-recent-messages: 6
  history-compaction-threshold: 8
  large-result-chars: 2000
  large-result-preview-chars: 500
  model-max-attempts: 2
  prefetch-enabled: false
  reasoning-batch-chars: 64
  reasoning-batch-interval-ms: 100
  trace-result-max-chars: 10000
  visual-read-enabled: false
  visual-max-pages-per-call: 2
  visual-max-pages-per-run: 4
  visual-max-pdf-bytes: 52428800
  visual-render-concurrency: 2
  visual-render-timeout-s: 20
  visual-render-max-memory-mb: 512
  visual-image-max-bytes: 1572864
  visual-image-token-estimate: 2000
