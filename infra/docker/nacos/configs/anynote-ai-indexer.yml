indexer:
  poll-interval-s: 3
  reconcile-interval-s: 3600
  batch-size: 50
  chunk-size-chars: 600
  summary-body-chars: 200
  embedding-batch-size: 16
  embedding-timeout-s: 30
  pdf-parse-timeout-s: 30
  pdf-max-memory-mb: 512
  pdf-max-bytes: 52428800
  ocr-enabled: false
  ocr-timeout-s: 120
  ocr-max-memory-mb: 2048
  ocr-max-pages: 200
  ocr-max-regions-per-page: 100
  ocr-render-scale: 2.0
  es-index-replicas: 0
  es-request-timeout-s: 15
