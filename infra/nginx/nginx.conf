# 安装在容器外 Nginx 的 http {} 内，例如 /etc/nginx/conf.d/anynote.conf。
# 替换 YOUR_DOMAIN 和证书路径。Nginx >= 1.25.1。
# 同机使用回环；独立 Nginx 主机时改为 Docker 主机私网 IP，并限制防火墙来源。
map $http_upgrade $anynote_connection_upgrade {
    default upgrade;
    '' close;
}

upstream anynote_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}
upstream anynote_collab {
    server 127.0.0.1:1234;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;
    ssl_certificate /path/to/cert/fullchain.pem;
    ssl_certificate_key /path/to/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 512M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # /collab/index → 协同容器 /index，末尾的 / 负责去掉路径前缀。
    location ^~ /collab/ {
        proxy_pass http://anynote_collab/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anynote_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        # 握手查询参数带短期协同令牌，不写入 access log。
        access_log off;
    }

    # /api/auth/*、/api/proxy/*（含 SSE）都进 BFF，不直接转 Gateway。
    location /api/ {
        include snippets/sse-common.conf;
    }

    # 保留 Next 的缓存头，不把 400/404 静态资源响应标成长期缓存。
    location / {
        proxy_pass http://anynote_frontend;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
