# 安装在容器外 Nginx 的 http {} 内，例如 /etc/nginx/conf.d/anynote.conf。
# 替换 YOUR_DOMAIN 和证书路径。Nginx >= 1.25.1。
# 同机使用回环；独立 Nginx 主机时改为 Docker 主机私网 IP，并限制防火墙来源。
#
# ============================ 本文件是自包含的 ============================
# 不依赖任何 include / snippets。拷这一个文件、替换域名与证书路径，`nginx -t` 即可。
# 曾把 SSE 指令抽成 `snippets/sse-common.conf` 复用，但那个片段自带 `proxy_pass`，
# 而本站点有**两个不同的 /api/ 上游**（站点域→BFF、api 域→Gateway）：
# `proxy_pass` 每个 location 只允许出现一次（nginx 源码 `ngx_http_proxy_pass()` 里
# `if (plcf->upstream.upstream) return "is duplicate";`），片段写死上游后第二处必然
# `nginx -t` 失败。为了可维护性，宁可让两处 SSE 指令各写一遍。
#
# 关于 proxy_set_header 的继承（易错，改动前必读）：
#   nginx 只在**当前层完全没有 proxy_set_header 时**才继承上一层的那一组；
#   一旦在某层写了任意一条，该层的整组都会**覆盖**而不是追加。
#   因此：下面的 location 里都刻意不写 proxy_set_header，以继承 server 级的公共转发头。
#   若确需在某个 location 覆盖其中一条（如 /collab/ 要改成 Upgrade），
#   必须把整组一起重写——仓库里 /collab/ 就是这么做的，可以照抄。
# =========================================================================
map $http_upgrade $anynote_connection_upgrade {
    default upgrade;
    '' close;
}

upstream anynote_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}
upstream anynote_collab {
    server 127.0.0.1:1234;
}
# 只绑回环（见 docker-compose.prod.yaml 的 anynote-gateway.ports）。
upstream anynote_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;
    ssl_certificate /path/to/cert/fullchain.pem;
    ssl_certificate_key /path/to/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 512M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # /collab/index → 协同容器 /index，末尾的 / 负责去掉路径前缀。
    location ^~ /collab/ {
        proxy_pass http://anynote_collab/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anynote_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        # 握手查询参数带短期协同令牌，不写入 access log。
        access_log off;
    }

    # /api/auth/*、/api/proxy/*（含 SSE）都进 BFF，不直接转 Gateway。
    #
    # SSE 指令（关缓冲 / 关缓存 / 关 gzip / 长读超时）必须就地写全，**不要抽成 snippet**：
    # `proxy_pass` 在每个 location 只能出现一次（nginx 源码 `ngx_http_proxy_pass()` 里
    # `if (plcf->upstream.upstream) return "is duplicate";`，判据存在 location 自己的配置里）。
    # 片段一旦自带 `proxy_pass`，第二处复用它的上游就必然是 "directive is duplicate"，
    # `nginx -t` 直接失败、reload 不进去；而站点域的 /api/ 必须转 BFF、api 域必须转 Gateway，
    # 这两个上游无法合并。所以宁可在这里重复几行，也不引入一个只能给单一上游用的片段。
    location /api/ {
        proxy_pass http://anynote_frontend;

        # ↓ 只写与 server 级不同的部分。注意 nginx 的继承规则：
        #   proxy_set_header 只有在**当前层没有任何 proxy_set_header 时**才继承上层。
        #   这里刻意一条都不写，于是完整继承 server 级的 Host / X-Real-IP /
        #   X-Forwarded-For / X-Forwarded-Proto / Connection ''。
        #   ⚠️ 若要在这里加任意一条 proxy_set_header，必须把上面 5 条**全部重复一遍**，
        #   否则其余 4 条会静默失效（真实 IP 与 Host 全丢）。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # 保留 Next 的缓存头，不把 400/404 静态资源响应标成长期缓存。
    location / {
        proxy_pass http://anynote_frontend;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

# ============================================================
# Gateway 的对外入口（CLI 直连用）
#
# 为什么需要独立 server_name：CLI **不经 BFF**，直接打 `apiUrl + /api/<domain>/*`
# （见 apps/cli/src/core/api.ts 与 docs/cli/CLI_PLAN.md）。而 YOUR_DOMAIN 的 /api/
# 是 Next BFF 的地盘（/api/auth/*、/api/proxy/*），两者路径前缀重叠但上游不同，
# 无法用同一个 server 块按路径区分——`/api/auth/cli-exchange` 属 BFF，
# `/api/auth/login` 属 Gateway，同名不同家。
#
# 部署：把 api.YOUR_DOMAIN 指向本文件所在 Nginx，然后
#   anynote config set api-url https://api.YOUR_DOMAIN
#   anynote config set web-url https://YOUR_DOMAIN
#
# 安全边界：这里只做 TLS 终止与转发，**鉴权仍由网关的 AuthFilter 负责**
# （非白名单路径一律要求 Bearer），与经 BFF 访问是同一套判定。
# ============================================================
server {
    listen 80;
    server_name api.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.YOUR_DOMAIN;
    ssl_certificate /path/to/cert/fullchain.pem;
    ssl_certificate_key /path/to/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 512M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # 网关的 actuator **只放通 health**（供 `anynote doctor` 探测）；
    # 其余 actuator 端点（env / beans / heapdump 等）一律 404。
    # 注意：actuator 由 WebFlux 的 handler 处理、不经过网关的 GlobalFilter，
    # 所以它**不满足 Bearer 校验**——必须在这里挡住，不能指望 AuthFilter。
    location = /actuator/health {
        proxy_pass http://anynote_gateway;
        access_log off;
    }
    location /actuator/ {
        return 404;
    }

    # SSE（AI 对话流）必须关缓冲；与站点域那处同样**刻意不写 proxy_set_header**，
    # 以完整继承 server 级那套转发头（详见文件顶部「关于 proxy_set_header 继承」注释）。
    location /api/ {
        proxy_pass http://anynote_gateway;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # Springdoc 聚合文档与 swagger-ui 不进公网入口：生产已关闭
    # （SPRINGDOC_*_ENABLED=false），这里再挡一道避免配置漂移导致暴露。
    location /swagger-ui.html { return 404; }
    location /swagger-ui/ { return 404; }
    location /webjars/ { return 404; }
    location /v3/api-docs { return 404; }

    # 其余路径（含 BFF 专用的 /api/auth/cli-exchange）不该出现在本域。
    location / {
        return 404;
    }
}

# ============================================================
# MinIO 的浏览器直连入口（docs/minio/MINIO_PLAN.md §7）
#
# 必须是**独立 server_name**：minio-java 的 endpoint 不允许带路径
# （HttpUtils: "no path allowed in endpoint"），所以 https://YOUR_DOMAIN/oss/ 这种
# 子路径反代直接出局。部署后把 sys_config.MIN_IO_CONFIG.publicEndPoint 指向本 server_name。
# ============================================================
upstream anynote_oss {
    server 127.0.0.1:9000;
    keepalive 16;
}

# 预签名 URL 的签名在 query string 里，不能写进 access log（与 /collab/ 的短期令牌同理）。
log_format anynote_oss '$remote_addr - [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent "$http_referer"';

server {
    listen 80;
    server_name oss.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name oss.YOUR_DOMAIN;

    ssl_certificate     /path/to/cert/fullchain.pem;
    ssl_certificate_key /path/to/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/anynote-oss.log anynote_oss;

    # 分片大小 = max(5, ceil(fileSize_MB/1000)) MB，给足余量
    client_max_body_size 1024M;
    # 大 PUT 不要先落盘再转发
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    # SigV4 把 Host 计入签名，这里**不可**改写成 minio:9000，否则一律 SignatureDoesNotMatch。
    # 不需要透传 scheme：canonical request 不含 scheme，nginx 终止 TLS、回源用 http 是安全的。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 不要在这里 add_header Access-Control-Allow-Origin：CORS 由 MinIO 自己回
    # （MINIO_API_CORS_ALLOW_ORIGIN），nginx 再加一份会变成重复头，浏览器直接判失败。

    location = /minio/health/live {
        proxy_pass http://anynote_oss;
        access_log off;
    }

    # 只放通 bucket 路径（path-style 寻址）。`anynote` 是桶名，改桶名要同步改这里，
    # 并与 sys_config.MIN_IO_CONFIG.bucketName 保持一致。
    location ^~ /anynote/ {
        proxy_pass http://anynote_oss;
    }

    # /minio/ui、/minio/admin 等落到这里：控制台与管理 API 不对外。
    # 不要设 proxy_cache —— 响应带签名，缓存会串用户。
    location / {
        return 404;
    }
}
